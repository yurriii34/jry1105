<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FDE 训练中心 · 全项目 MVP 开发提示词（94）</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--ink:#1f2329;--sub:#646a73;--line:#e5e6eb;--brand:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px}
header{background:linear-gradient(135deg,#2563eb,#0ea5e9);color:#fff;border-radius:16px;padding:30px 32px;margin-bottom:22px}
header h1{margin:0 0 8px;font-size:28px}header p{margin:4px 0;opacity:.92}
.stats{display:flex;gap:18px;margin-top:16px;flex-wrap:wrap}.stat{background:rgba(255,255,255,.16);padding:8px 14px;border-radius:10px;font-size:14px}
.toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
input,select{padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:var(--card);color:var(--ink)}
input{flex:1;min-width:220px}
select{min-width:180px}
section{margin:26px 0}section h2{font-size:18px;margin-bottom:10px}section h2 small{color:var(--sub);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.item{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);text-decoration:none;transition:.15s}
.item:hover{border-color:var(--brand);box-shadow:0 4px 14px rgba(37,99,235,.12);text-decoration:none;transform:translateY(-1px)}
.item b{font-size:14px}.item span{font-size:12px;color:var(--sub);margin-top:4px}
.empty{text-align:center;color:var(--sub);padding:48px 0;font-size:15px}
.error{text-align:center;color:var(--sub);padding:48px 0;font-size:15px}
.error code{background:#f1f3f5;padding:2px 6px;border-radius:4px;font-size:13px;color:#c7254e}
footer{text-align:center;color:var(--sub);font-size:13px;margin:40px 0}
</style></head><body><div class="wrap">
<header><h1>FDE 训练中心 · 全项目 MVP 开发提示词</h1>
<p>基于 FastAPI + Harness 工程 + 知识库系统 · 每份提示词可在 90 分钟内指导产出一个可运行 MVP</p>
<p>覆盖系统内全部项目，每项目一份独立文档（可在线查看 / 下载 DOCX）</p>
<div class="stats" id="stats"></div></header>
<div class="toolbar">
<input id="q" placeholder="🔍 输入项目名称、公司或业务域快速筛选…" oninput="filter()" aria-label="搜索项目">
<select id="sector" onchange="filter()" aria-label="按业务域筛选"><option value="">全部业务域</option></select>
</div>
<div id="content"><p class="meta" id="loading">加载中…</p></div>
<noscript><p class="error">本页面需要启用 JavaScript 才能加载项目列表（数据来自 projects.json）。</p></noscript>
<footer>Generated for fsg-contract / FDE Discovery · 全部业务上下文取自训练系统项目档案（合成数据）</footer>
</div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let projects=[];
async function init(){
  try{
    const res=await fetch('projects.json');
    if(!res.ok)throw new Error('HTTP '+res.status);
    projects=await res.json();
  }catch(e){
    document.getElementById('content').innerHTML=
      '<p class="error">项目列表（projects.json）加载失败：'+esc(e.message)+
      '。若直接以 file:// 打开本页，浏览器会阻止 fetch，请在仓库根目录运行 <code>python -m http.server</code> 后访问 <code>http://localhost:8000/site/</code>。</p>';
    return;
  }
  const sectors=[...new Set(projects.map(p=>p.sector))];
  const nDoc=projects.filter(p=>p.docx).length;
  document.getElementById('stats').innerHTML=
    '<div class="stat">📦 项目总数：'+projects.length+'</div>'+
    '<div class="stat">🏷 业务域：'+sectors.length+'</div>'+
    '<div class="stat">📄 文档：'+nDoc+' 份 DOCX</div>';
  const sel=document.getElementById('sector');
  sel.innerHTML='<option value="">全部业务域（'+sectors.length+'）</option>'+
    sectors.map(s=>'<option value="'+esc(s)+'">'+esc(s)+'（'+projects.filter(p=>p.sector===s).length+'）</option>').join('');
  render();
}
function render(){
  const sel=document.getElementById('sector').value;
  const picked=sel?projects.filter(p=>p.sector===sel):projects;
  // 分组：业务域按组内最小编号排序，组内按编号排序（与旧版静态页一致）
  const bySector=new Map();
  picked.forEach(p=>{if(!bySector.has(p.sector))bySector.set(p.sector,[]);bySector.get(p.sector).push(p);});
  const order=[...bySector.keys()].sort((a,b)=>Math.min(...bySector.get(a).map(p=>p.idx))-Math.min(...bySector.get(b).map(p=>p.idx)));
  document.getElementById('content').innerHTML=order.map(s=>
    '<section><h2>'+esc(s)+' <small>('+bySector.get(s).length+')</small></h2><div class="grid">'+
    bySector.get(s).sort((a,b)=>a.idx-b.idx).map(p=>
      '<a class="item" href="'+esc(p.html)+'"><b>'+esc(p.idx)+' '+esc(p.name)+'</b>'+
      (p.company?'<span>'+esc(p.company)+'</span>':'')+'</a>').join('')+
    '</div></section>').join('')||'';
}
function filter(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const sel=document.getElementById('sector').value;
  render();
  let vis=0;
  document.querySelectorAll('#content section').forEach(s=>{
    let n=0;s.querySelectorAll('.item').forEach(a=>{
      const ok=a.textContent.toLowerCase().includes(q);
      a.style.display=ok?'flex':'none';if(ok)n++;});
    s.style.display=n?'block':'none';vis+=n;
  });
  const c=document.getElementById('content');
  if(!vis){
    c.innerHTML+='<p class="empty" id="noResult">🔍 没有匹配的项目，换个关键词或业务域试试</p>';
  }
}
init();
</script></body></html>
